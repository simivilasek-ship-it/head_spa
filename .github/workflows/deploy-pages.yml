name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build static export
        env:
          # Bez basePath — site běží na https://sarya-headspa.cz (public/CNAME).
          # Pro náhled na *.github.io/head_spa/ by bylo GITHUB_PAGES=true.
          NEXT_PUBLIC_BOOKING_URL: https://www.notino.cz/salony/sarya-head-spa_1/
        run: npm run build
      - name: Disable Jekyll
        run: touch out/.nojekyll
      - name: Ensure CNAME for custom domain
        run: |
          test -f out/CNAME
          echo "CNAME: $(cat out/CNAME)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
